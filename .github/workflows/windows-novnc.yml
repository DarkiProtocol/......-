name: Windows Premade noVNC RDP
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Install Node.js & Websockify/noVNC Bridge
      run: |
        choco install nodejs -y
        npm install -g websockify

    - name: Download Premade noVNC Client
      shell: bash
      run: |
        git clone https://github.com/novnc/noVNC.git novnc-client

    - name: Download Tunneling Agent via Chocolatey
      run: |
        choco install ngrok -y

    - name: Authenticate Tunnel
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Launch noVNC Server and Tunnel
      run: |
        # Launch websockify to convert RDP traffic on port 6080
        Start-Process cmd -ArgumentList "/c websockify 6080 localhost:3389"
        
        # Expose the noVNC port to the web
        Start-Process cmd -ArgumentList "/c ngrok http 6080"
        
        # Keep runner alive for up to 6 hours
        Write-Host "Windows noVNC Server is running successfully..."
        Start-Sleep -Seconds 21600
        
